spring:
  application:
    name: redis-patterns-lab
  sql:
    init:
      mode: always

# Не больше 10 запросов к каталогу от одного клиента в секунду.
# algorithm: FIXED_WINDOW (сценарий 1), SLIDING_LOG или TOKEN_BUCKET (сценарий 2).
rate-limit:
  limit: 10
  window: 1s
  algorithm: FIXED_WINDOW

# Сценарий 3: выгрузка каталога партнёру под распределённой блокировкой.
catalog-export:
  lease: 10s
  work-duration: 5s
  renew-every: 3s

# Сценарий 4: оплата через внешнего платёжного провайдера и идемпотентность запросов.
payments:
  # Сколько отвечает провайдер: так повтор успевает прийти, пока первый запрос в работе.
  provider-delay: 2s
  # Передавать ли провайдеру ключ идемпотентности (сценарий показывает и true, и false).
  pass-key-to-provider: true
idempotency:
  in-progress-ttl: 30s
  completed-ttl: 24h
