spring:
  application:
    name: redis-patterns-lab
  sql:
    init:
      mode: always

# Не больше 10 запросов к каталогу от одного клиента в секунду.
# algorithm: FIXED_WINDOW (сценарий 1), SLIDING_LOG или TOKEN_BUCKET (сценарий 2).
rate-limit:
  limit: 10
  window: 1s
  algorithm: FIXED_WINDOW

# Сценарий 3: выгрузка каталога партнёру под распределённой блокировкой.
catalog-export:
  lease: 10s
  work-duration: 5s
  renew-every: 3s

# Сценарий 4: создание заказа и идемпотентность запросов.
orders:
  # «Проверка и резерв» перед записью заказа: так повтор успевает прийти, пока первый запрос в работе.
  processing-delay: 2s
idempotency:
  in-progress-ttl: 30s
  completed-ttl: 24h
